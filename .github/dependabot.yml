version: 2
updates:
  # Las acciones están fijadas por SHA: Dependabot propone los SHA nuevos (y el comentario de versión).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dependencias npm del monorepo: los avisos de seguridad llegan como PR sin esperar a un `pnpm audit` manual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
