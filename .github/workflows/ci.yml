name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reutilizado por release.yml: nada se publica sin pasar esto

# Mínimo privilegio: el CI solo lee el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · build · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      # Postgres real: los tests de @uniora/postgres y @uniora/cli son de integración, nunca mocks.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: uniora
          POSTGRES_DB: uniora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credenciales efímeras del servicio de arriba (solo existen durante este job). Bases distintas,
      # igual que en local: la suite trunca TEST_DATABASE_URL, nunca DATABASE_URL.
      DATABASE_URL: postgresql://postgres:uniora@localhost:5432/uniora
      TEST_DATABASE_URL: postgresql://postgres:uniora@localhost:5432/uniora_test

    steps:
      # Acciones fijadas por SHA de commit (no por tag movible): supply chain, skill de seguridad §33-34.
      # Dependabot (.github/dependabot.yml) propone las actualizaciones.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (la versión de pnpm sale de "packageManager")

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build antes de typecheck/test: los paquetes se consumen entre sí a través de dist/.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

  packages:
    name: paquetes publicables (tarballs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release.mjs
      # Ensayo de publicación: arma (prepack = build fresco) y valida cada tarball sin subir nada.
      - run: pnpm -r publish --dry-run --no-git-checks
