name: Release

# Se publica al empujar un tag vX.Y.Z (p. ej. `git tag v0.1.0 && git push origin v0.1.0`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: npm publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configura "Required reviewers" en este environment (Settings → Environments → npm):
    # así cada publicación necesita una aprobación humana explícita.
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance: npm firma de qué commit/workflow salió cada tarball

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Que el tag, las versiones y los metadatos de todos los paquetes coincidan antes de subir nada.
      - run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      # pnpm (no npm) publica: convierte "workspace:^" en la versión real. Omite lo ya publicado y lo private.
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
