name: Release

# Se publica al empujar un tag vX.Y.Z (p. ej. `git tag v0.1.0 && git push origin v0.1.0`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: npm publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configura "Required reviewers" en este environment (Settings → Environments → npm):
    # así cada publicación necesita una aprobación humana explícita.
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance: npm firma de qué commit/workflow salió cada tarball

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Que el tag, las versiones y los metadatos de todos los paquetes coincidan antes de subir nada.
      - run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      # Compila todo el workspace antes de publicar. El `prepack` de cada paquete solo recompila ese paquete:
      # si @uniora/core ya estaba publicado, pnpm lo omite y su dist/ no existe en este runner limpio, y el
      # tsc de los paquetes que dependen de él no encontraría @uniora/core.
      - run: pnpm -r build

      # pnpm (no npm) publica: convierte "workspace:^" en la versión real. Omite lo ya publicado y lo private.
      # Sin NPM_TOKEN: se autentica con OIDC (Trusted Publishing). Cada paquete @uniora/* debe tener
      # configurado en npmjs.com (Settings → Trusted Publisher) este repo, el workflow `release.yml`
      # y el environment `npm`.
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
