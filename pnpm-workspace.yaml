packages:
  - "packages/*"
  - "packages/adapters/*"
  - "packages/database/*"
  - "apps/*"
  - "test/integration"
  - "examples/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6

# Transitive dependencies with published advisories (pnpm audit --prod, audit F-07). Remove an entry
# once the package that pulls it in ships a fixed range of its own.
overrides:
  source-map-js: ">=1.2.2"
  sharp: ">=0.35.5"
  "@modelcontextprotocol/sdk": ">=1.31.0"

# No fixed version of braces exists yet (3.0.3 is the latest). Reached only through devDependencies
# (eslint-config-next, shadcn) of apps/playground (private, never published) and @uniora/studio — a
# published package, but its devDependencies are never installed by anyone who depends on it, only
# by this monorepo's own tooling. Revisit when braces ships a fix.
# picomatch (GHSA-fc5q-39xc-vjpf, ReDoS through a single-branch glob pattern, high): the advisory names 4.0.8
# as the fix but the registry's latest is 4.0.7 (checked 2026-11-17), so it cannot be updated yet. Reached
# only through shadcn and the lint/type tooling (apps/playground is private; @uniora/studio's devDependencies
# are never installed by its users); nothing published depends on it at runtime. Ignored with the owner's OK
# (2026-11-17). Remove this entry once picomatch >= 4.0.8 exists and the lockfile resolves it.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-fc5q-39xc-vjpf
