packages:
  - "packages/*"
  - "packages/adapters/*"
  - "packages/database/*"
  - "apps/*"
  - "test/integration"
  - "examples/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6

# Transitive dependencies with published advisories (pnpm audit --prod, audit F-07). Remove an entry
# once the package that pulls it in ships a fixed range of its own.
overrides:
  source-map-js: ">=1.2.2"
  sharp: ">=0.35.5"
  "@modelcontextprotocol/sdk": ">=1.31.0"

# No fixed version of braces exists yet (3.0.3 is the latest) and it is reached only through
# apps/playground, which is private and never published. Revisit when braces ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
